<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body style="margin: 0; padding: 0; background: black; color: white; font-family: sans-serif;">
    <div id="root">
      <div id="app-loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; background: black; color: white; font-family: sans-serif;">
        <div style="width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <h1 style="font-size: 1.2rem; margin-bottom: 10px;">Carcassonne Scoring</h1>
        <p id="loader-status" style="color: #666; font-size: 0.9rem;">Starting the applet...</p>
        <div id="loader-fallback" style="display: none; margin-top: 30px;">
          <p style="color: #ff4444; font-size: 0.8rem; margin-bottom: 15px;">Applet is taking longer than expected to load.</p>
          <button onclick="window.location.reload()" style="padding: 10px 20px; background: white; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Reload Applet</button>
        </div>
        <noscript>
          <p style="color: #ff4444; margin-top: 20px;">JavaScript is required to run this app.</p>
        </noscript>
      </div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      console.log('HTML head loaded, starting script execution...');
      window.appStartTime = Date.now();
      
      // Show fallback after 8 seconds
      setTimeout(() => {
        const fallback = document.getElementById('loader-fallback');
        if (fallback && document.getElementById('app-loader')) {
          fallback.style.display = 'block';
        }
      }, 8000);

      // Check for common iframe issues
      try {
        localStorage.setItem('test', 'test');
        localStorage.removeItem('test');
        console.log('LocalStorage access: OK');
      } catch (e) {
        console.warn('LocalStorage access: BLOCKED (common in cross-origin iframes)');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
